# Builds the real Android app and runs every test on each push, and keeps a debug APK to download.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests (time bank, blocking rules, clock, updates)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Game rule tests
        run: node --test web-tests/games.test.js web-tests/dealer.test.js

      - name: UI test in Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node web-tests/e2e.js build/e2e

      - name: Stress test (extreme data, every screen, widths, themes, clock fonts)
        run: node web-tests/stress.js build/stress

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: ante-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Keep UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/e2e/*.png
          retention-days: 7
